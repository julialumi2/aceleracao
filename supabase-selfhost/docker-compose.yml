# Supabase self-hosted (stack mínima: Postgres + Auth + REST + Studio).
# Deploy no Dokploy como um app do tipo "Docker Compose", apontando pra
# esta pasta. Realtime/Storage/Functions ficam de fora por enquanto —
# o app da Sala Cheia hoje só usa Auth e REST (tabelas via PostgREST).
#
# Antes de subir:
#   1. Copie .env.example para .env e preencha os valores (ver instruções
#      dentro do arquivo — inclui como gerar JWT_SECRET/ANON_KEY/SERVICE_ROLE_KEY).
#   2. Em volumes/api/kong.yml, troque ANON_KEY_PLACEHOLDER e
#      SERVICE_ROLE_KEY_PLACEHOLDER pelos mesmos valores do seu .env.

services:
  db:
    image: supabase/postgres:15.1.0.147
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    image: supabase/gotrue:v2.151.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${SITE_URL}
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      # E-mail/SMTP: ajuste com seu provedor (Resend, SES, etc.) quando
      # for enviar confirmação de cadastro de verdade.
      GOTRUE_MAILER_AUTOCONFIRM: "true"

  rest:
    image: postgrest/postgrest:v12.0.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}

  meta:
    image: supabase/postgres-meta:v0.80.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}

  studio:
    image: supabase/studio:latest
    restart: unless-stopped
    depends_on:
      - meta
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: Sala Cheia
      DEFAULT_PROJECT_NAME: sala-cheia
      SUPABASE_URL: http://kong:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}

  kong:
    image: kong:2.8.1
    restart: unless-stopped
    depends_on:
      - auth
      - rest
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    volumes:
      # Template sem segredo, versionado no Git. As chaves reais só existem
      # dentro do container, geradas pelo entrypoint abaixo a cada start.
      - ./volumes/api/kong.yml.template:/tmp/kong.yml.template:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        sed -e "s|ANON_KEY_PLACEHOLDER|$$ANON_KEY|g" -e "s|SERVICE_ROLE_KEY_PLACEHOLDER|$$SERVICE_ROLE_KEY|g" /tmp/kong.yml.template > /var/lib/kong/kong.yml
        exec /docker-entrypoint.sh kong docker-start
    ports:
      - "8000:8000" # API pública (Auth + REST) — aponte VITE_SUPABASE_URL pra cá
      - "8443:8443"

  studio-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - studio
    ports:
      - "3001:80" # Studio (GUI de admin) — acesse via http://SEU_IP:3001
    command: >
      sh -c "echo 'server { listen 80; location / { proxy_pass http://studio:3000; proxy_set_header Host $$host; } }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"

volumes:
  db-data:
